listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;
srs_log_level       info;
pid                 ./objs/srs.pid;

http_api {
    enabled         on;
    listen          0.0.0.0:1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          0.0.0.0:8080;
    dir             /var/mediamtx/hls;
    crossdomain     on;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;

    play {
        gop_cache   on;
    }

    dvr {
        enabled     off;
    }

    # Near-realtime teacher monitor (OBS → HTTP-FLV in browser)
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      60;
        hls_cleanup     on;
        hls_dispose     30;
        hls_path        /var/mediamtx/hls;
        hls_m3u8_file   [app]/[stream]/index.m3u8;
        hls_ts_file     [app]/[stream]/seg-[seq].ts;
        hls_wait_keyframe on;
    }

    http_hooks {
        enabled         on;
        on_publish      http://api:3000/v1/internal/live/on_publish;
        on_unpublish    http://api:3000/v1/internal/live/on_unpublish;
        on_hls          http://api:3000/v1/internal/live/on_hls;
    }
}
